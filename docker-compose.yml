version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invite_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invite_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Run once to apply pending Prisma migrations.
  # Usage: docker compose --profile migrate up migrate
  migrate:
    build:
      context: .
      target: builder   # uses the full node_modules stage
    command: npx prisma migrate deploy
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` — not reachable from the host, only from other services
    # on this compose network (matches the "internal network only" rule
    # for production). Use `docker compose exec redis redis-cli` to inspect.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devpassword}", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      REDIS_URL: "redis://:${REDIS_PASSWORD:-devpassword}@redis:6379"

  # Maintenance worker (BullMQ) — same image as `app`, different entrypoint.
  # Must never run alongside `migrate deploy`; see Dockerfile CMD notes.
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist-worker/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: "redis://:${REDIS_PASSWORD:-devpassword}@redis:6379"

volumes:
  postgres_data:
  redis_data:
